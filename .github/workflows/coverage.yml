name: Test Coverage Reporting

on:
  push:
    branches: [ master, feature ]
  pull_request:
    branches: [ master ]

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    name: Build, Test & Coverage Upload
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Run Backend Tests (JaCoCo)
        run: |
          cd backend
          mvn clean test
        env:
          # Prevent database errors in tests by mocking env configuration if required,
          # or let surefire run tests with the active test profile configurations.
          SPRING_PROFILES_ACTIVE: test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests (Vitest)
        run: |
          cd frontend
          npx vitest run --coverage
        env:
          NODE_ENV: test

      - name: Upload Coverage Reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            backend/target/site/jacoco/jacoco.xml
            frontend/coverage/lcov.info
          flags: |
            backend
            frontend
          name: speakit-coverage-report
          fail_ci_if_error: true

      - name: Build Docker Images (Backend & Frontend)
        run: |
          docker build -t mohitur/speakit:backend backend/
          docker build -t mohitur/speakit:frontend frontend/

      - name: Scan Backend Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mohitur/speakit:backend'
          format: 'table'
          exit-code: '1' # Fails build on High/Critical CVEs
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Scan Frontend Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mohitur/speakit:frontend'
          format: 'table'
          exit-code: '1' # Fails build on High/Critical CVEs
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
