# Destination: .github/workflows/dependabot-report.yml
name: Dependabot Report

on:
  schedule:
    - cron: "30 1 * * 1" # Mondays 07:00 IST
  workflow_dispatch:
    inputs:
      state:
        description: Alert state filter
        type: choice
        default: open
        options: [open, fixed, dismissed, auto_dismissed, all]
      min_severity:
        description: Lowest severity to include
        type: choice
        default: low
        options: [low, medium, high, critical]
  # Bridge for a real-time run: a repository webhook on `dependabot_alert`
  # posting `{"event_type":"dependabot-alert"}` to the dispatches API.
  repository_dispatch:
    types: [dependabot-alert]

permissions:
  contents: read
  security-events: read
  vulnerability-alerts: read

concurrency:
  group: dependabot-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/scripts/requirements.txt

      # WeasyPrint needs the system Pango/Cairo stack for PDF rendering.
      - name: Install PDF toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi-dev libjpeg-turbo8

      - name: Install Python dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Generate report
        env:
          # GITHUB_TOKEN works where `vulnerability-alerts: read` is available.
          # Otherwise create a PAT with `security_events` (classic) or fine-grained
          # `Dependabot alerts: read`, and store it as DEPENDABOT_TOKEN.
          GITHUB_TOKEN: ${{ secrets.DEPENDABOT_TOKEN || github.token }}
        run: |
          python .github/scripts/dependabot_report.py \
            --repo "${{ github.repository }}" \
            --state "${{ inputs.state || 'open' }}" \
            --min-severity "${{ inputs.min_severity || 'low' }}" \
            --out reports/dependabot

      - name: Job summary
        if: always()
        run: cat reports/dependabot/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload report bundle
        uses: actions/upload-artifact@v4
        with:
          name: dependabot-report-${{ github.run_number }}
          path: reports/dependabot/
          retention-days: 90
          if-no-files-found: error
