name: Keep Alive

on:
  schedule:
    # Run every 25 minutes (GitHub's reliable minimum for free tier)
    - cron: '*/25 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          # Replace the URL with your actual Render backend URL
          # Or better, set it as a GitHub Secret named RENDER_URL
          URL="${{ secrets.RENDER_URL }}"
          if [ -z "$URL" ]; then
            echo "Error: RENDER_URL secret is not set."
            exit 1
          fi
          echo "Pinging $URL..."
          curl -s -f "$URL/api/auth/ping" || echo "Ping failed, but that's okay (might be spinning up)"
