name: Keep Alive

on:
  schedule:
    # Run every 25 minutes (GitHub's reliable minimum for free tier)
    - cron: '*/25 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          URL="${{ secrets.RENDER_URL }}"
          if [ -z "$URL" ]; then
            echo "::error::RENDER_URL secret is not set. Please add it to your repository secrets."
            exit 1
          fi
          
          echo "Initiating health check for: $URL"
          echo "Timestamp: $(date -u)"
          
          RESPONSE=$(curl -s -w "%{http_code}" -o /dev/null "$URL/api/auth/ping")
          
          if [ "$RESPONSE" -eq 200 ]; then
            echo "::notice::Health check successful (HTTP 200). Service is active."
          elif [ "$RESPONSE" -eq 000 ]; then
            echo "::warning::Connection failed. The service might be down or the URL is incorrect."
          else
            echo "::warning::Service returned status $RESPONSE. It might be spinning up or experiencing issues."
          fi
