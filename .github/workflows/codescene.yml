name: CodeScene Quality Gate

on:
  pull_request:
    branches: [ master ]

jobs:
  codescene-check:
    runs-on: ubuntu-latest
    name: CodeScene Code Health Analysis
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # CodeScene requires full git history to perform delta analysis

      - name: CodeScene Delta Analysis
        uses: codescene/codescene-action@v2.0.0
        env:
          CODESCENE_ANALYSIS_TOKEN: ${{ secrets.CODESCENE_ANALYSIS_TOKEN }}
        with:
          # Delta analysis targets only code health regressions in touched files.
          # Pre-existing debt will NOT fail the pull request.
          fail-on-regression: true
        continue-on-error: true # Failsafe: prevent blocker if CodeScene API is temporarily offline
