name: "CodeQL Advanced Security"
# NOTE: CodeQL Advanced Security requires a GitHub Advanced Security (GHAS) license
# for private repositories. Both jobs below are gated on the repo being public.
# If the repo is made public again, scanning resumes automatically — no config changes needed.
# To enable on a private repo, purchase GHAS: https://github.com/features/security

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '0 2 * * 1' # Mondays 07:30 IST (02:00 UTC)
  workflow_dispatch:
    inputs:
      profile:
        description: "Select CodeQL profile"
        required: true
        type: choice
        default: "all"
        options:
          - "all"
          - "java"
          - "java-kotlin"
          - "javascript/typescript"
          - "python"
          - "actions"
          - "swift"
      confirm:
        description: "Confirm"
        required: true
        type: choice
        default: "Yes"
        options:
          - "Yes"
          - "No"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # 1. Non-Swift Languages (Fast Linux Runner via CodeQL)
  # Skipped on private repos — CodeQL requires GHAS license for private repositories.
  analyze-general:
    name: Analyze (${{ matrix.language }})
    if: >-
      !github.event.repository.private &&
      (github.event_name != 'workflow_dispatch' || inputs.confirm == 'Yes')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Check if language is selected
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          P="${{ inputs.profile }}"
          L="${{ matrix.language }}"
          
          if [ "$P" = "all" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif { [ "$P" = "java" ] || [ "$P" = "java-kotlin" ]; } && [ "$L" = "java-kotlin" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif { [ "$P" = "javascript/typescript" ] || [ "$P" = "javascript-typescript" ]; } && [ "$L" = "javascript-typescript" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "$P" = "$L" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up JDK 25
        if: steps.filter.outputs.should_run == 'true' && matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Initialize CodeQL
        if: steps.filter.outputs.should_run == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - if: steps.filter.outputs.should_run == 'true' && matrix.build-mode == 'autobuild'
        name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        if: steps.filter.outputs.should_run == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # 2. Swift Analysis (macOS Runner with Custom xcodebuild)
  # SKIPPED when a PR is raised (pull_request) or merged (push) to ensure fast CI turnaround.
  # Runs ONLY on manual workflow_dispatch when 'swift' is selected (or 'all'), and on scheduled weekly scans.
  # Skipped on private repos — CodeQL requires GHAS license for private repositories.
  analyze-swift:
    name: Analyze (swift)
    runs-on: macos-latest
    if: >-
      !github.event.repository.private &&
      (
        (github.event_name == 'schedule') ||
        (github.event_name == 'workflow_dispatch' && inputs.confirm == 'Yes' && (inputs.profile == 'swift' || inputs.profile == 'all'))
      )
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL for Swift
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Build iOS Application (xcodebuild)
        run: |
          xcodebuild -project ios/SpeakIT/SpeakIT.xcodeproj \
                     -scheme SpeakIT \
                     -destination 'generic/platform=iOS' \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
