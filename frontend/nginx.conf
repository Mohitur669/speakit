server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SEC-06: HTTP Security Headers (CWE-693)
    # Prevent clickjacking, MIME sniffing, and data leakage.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # HSTS: enforce HTTPS for 1 year (enable once TLS is active on the host)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-Security-Policy: adjust src values for your CDN / API domains
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://checkout.razorpay.com; frame-src 'self' https://api.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.razorpay.com ws: wss:; media-src 'self' blob:;" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
