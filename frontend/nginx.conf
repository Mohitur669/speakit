server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # SEC-06: HTTP Security Headers (CWE-693)
    # Prevent clickjacking, MIME sniffing, and data leakage.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header X-XSS-Protection "0" always;

    # HSTS: enforce HTTPS for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-Security-Policy:
    # - Non-fallback directives: form-action, base-uri, frame-ancestors, object-src
    # - Audio streaming permitted from cdn-speakit-audio.mohitur.com
    # - Both avatar CDN hostnames permitted
    # - WebSockets explicitly permitted for backend API and local dev
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://checkout.razorpay.com https://cdn.razorpay.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn-speakit-avatar.mohitur.com https://cdn-speakit-avatars.mohitur.com https://*.razorpay.com; connect-src 'self' https://api.razorpay.com https://speakit-prod-api.mohitur.com wss://speakit-prod-api.mohitur.com ws: wss:; media-src 'self' blob: https://cdn-speakit-audio.mohitur.com; form-action 'self' https://api.razorpay.com; base-uri 'self'; frame-ancestors 'none'; object-src 'none';" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
