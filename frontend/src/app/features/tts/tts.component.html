<div class="min-h-screen bg-primary-50 dark:bg-primary-950">
  <app-navbar></app-navbar>

  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-4 sm:py-8 md:py-12">
    <!-- Studio Module Toggle -->
    <div class="flex justify-center mb-8 sm:mb-12">
      <div
        class="inline-flex p-1.5 bg-primary-100 dark:bg-primary-800/40 rounded-2xl border border-primary-300 dark:border-primary-700/50 shadow-inner backdrop-blur-sm"
      >
        <button
          class="flex items-center gap-2.5 px-6 py-2.5 rounded-xl text-sm font-bold transition-all bg-white dark:bg-primary-900 text-brand-blue shadow-xl dark:shadow-[0_10px_25px_-5px_rgba(0,0,0,0.5)] ring-1 ring-black/5 dark:ring-white/10"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"
            ></path>
          </svg>
          Text to Speech
        </button>
        <a
          routerLink="/stt"
          class="flex items-center gap-2.5 px-6 py-2.5 rounded-xl text-sm font-bold transition-all text-primary-500 hover:text-primary-900 dark:text-primary-400 dark:hover:text-white group"
        >
          <svg
            class="w-4 h-4 transition-transform group-hover:scale-110"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z M19 10v1a7 7 0 01-14 0v-1 M12 18v4 M8 22h8"
            ></path>
          </svg>
          Speech to Text
        </a>
      </div>
    </div>

    <!-- Page Header -->
    <div class="mb-8 sm:mb-12 animate-fade-in">
      <h1
        class="text-4xl md:text-5xl font-bold text-primary-900 dark:text-white tracking-tight mb-4"
      >
        Text to
        <span
          class="text-transparent bg-clip-text bg-gradient-to-r from-brand-blue via-brand-purple to-accent-500"
          >Speech</span
        >
      </h1>
      <p class="text-lg text-primary-600 dark:text-primary-400">
        Convert text into natural-sounding speech instantly.
      </p>
    </div>

    <!-- Main Content Grid -->
    <div class="grid md:grid-cols-3 gap-3 sm:gap-4 md:gap-6 items-start">
      <!-- Left Column - Voice Selection & Stats (Desktop Only) -->
      <div class="hidden md:flex md:col-span-1 flex-col gap-3 sm:gap-4 md:gap-6 animate-slide-up">
        <app-voice-selector
          [voices]="voices"
          [voiceId]="selectedVoiceId"
          [userCanUseGlobal]="userCanUseNatural"
          [userCanUseSarvam]="userCanUseSarvam"
          (voiceChange)="handleVoiceChange($event)"
          (filterChanged)="selectedVoiceType = $event"
          (showNotification)="handleNotification($event)"
        >
        </app-voice-selector>

        <app-usage-stats
          class="hidden md:block"
          [planType]="authService.currentPlanType()"
          [textLength]="text.length"
          [maxChars]="maxChars()"
        >
        </app-usage-stats>

        <!--
        <app-upgrade-card
          class="hidden md:block"
          *ngIf="authService.currentPlanType() !== 'ENTERPRISE'"
          [currentPlan]="authService.currentPlanType()"
          (upgrade)="invokeUpgrade($event)">
        </app-upgrade-card>
        -->
      </div>

      <!-- Right Column - Editor -->
      <div class="md:col-span-2 flex flex-col gap-3 sm:gap-4 md:gap-6 animate-slide-up stagger-1">
        <!-- Mobile Settings Header Bar (Mobile Only) -->
        <div class="md:hidden flex items-center justify-between p-4 bg-white dark:bg-primary-900 border border-primary-300 dark:border-primary-700 rounded-2xl shadow-sm">
          <div class="flex flex-col gap-0.5">
            <span class="text-xs font-bold text-primary-500 tracking-wider">SELECTED VOICE</span>
            <div class="flex items-center gap-1.5">
              <span class="text-base font-extrabold text-primary-900 dark:text-white">{{ selectedVoice?.name || 'Select Voice' }}</span>
              @if (selectedVoice) {
                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-primary-100 dark:bg-primary-800 text-primary-600 dark:text-primary-400">
                  {{ selectedVoice.gender }}
                </span>
              }
            </div>
          </div>
          <button
            type="button"
            (click)="showSettings.set(true)"
            class="p-2.5 text-primary-500 hover:text-brand-blue dark:text-primary-400 dark:hover:text-white rounded-xl bg-primary-100 hover:bg-primary-200 dark:bg-primary-800 dark:hover:bg-primary-700/80 transition-all border border-primary-300 dark:border-primary-700/50 shadow-inner"
            title="Voice Settings"
          >
            <svg class="w-5 h-5 animate-hover-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
          </button>
        </div>
        <app-tts-input
          [(text)]="text"
          [maxChars]="maxChars()"
          [usage]="usage()"
          [loading]="loading()"
          [voiceId]="selectedVoiceId"
          (convert)="convert()"
        >
        </app-tts-input>

        <button
          (click)="convert()"
          [disabled]="loading() || !text.trim() || !selectedVoiceId"
          class="w-full py-4 px-6 rounded-2xl font-bold text-white bg-brand-blue hover:bg-brand-blue/90 disabled:opacity-50 disabled:cursor-not-allowed shadow-xl hover:shadow-brand-blue/20 active:scale-[0.98] transition-all flex items-center justify-center gap-3"
        >
          @if (loading()) {
            <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
              ></path>
            </svg>
          }
          @if (!loading()) {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"
              ></path>
            </svg>
          }
          <span>{{ loading() ? 'Generating...' : 'Generate Speech' }}</span>
        </button>

        <!-- Error Alert -->
        @if (error()) {
          <div
            class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800/30 rounded-xl p-4"
          >
            <p class="text-sm text-red-600 dark:text-red-400 flex items-center gap-2">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                ></path>
              </svg>
              {{ error() }}
            </p>
          </div>
        }

        @if (audioUrl()) {
          <app-tts-output [audioUrl]="audioUrl()" (download)="download()"> </app-tts-output>
        }
      </div>
    </div>
  </div>

  <!-- Settings Modal (Mobile Only) -->
  @if (showSettings()) {
    <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4" (click)="showSettings.set(false)">
      <div 
        class="bg-white dark:bg-primary-950 rounded-2xl border border-primary-300 dark:border-primary-800 shadow-2xl w-full max-w-lg overflow-hidden animate-slide-up flex flex-col max-h-[85vh]"
        (click)="$event.stopPropagation()"
      >
        <!-- Header -->
        <div class="px-6 py-4 border-b border-primary-200 dark:border-primary-800 flex items-center justify-between bg-primary-50 dark:bg-primary-900/50">
          <div class="flex items-center gap-2">
            <svg class="w-5 h-5 text-brand-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            <h3 class="text-base font-bold text-primary-900 dark:text-white">TTS Settings</h3>
          </div>
          <button
            type="button"
            (click)="showSettings.set(false)"
            class="p-1.5 text-primary-500 hover:text-primary-700 dark:text-primary-400 dark:hover:text-white rounded-lg hover:bg-primary-100 dark:hover:bg-primary-800 transition-colors"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>

        <!-- Body with scroll area -->
        <div class="p-6 overflow-y-auto space-y-6 flex-1">
          <div>
            <label class="block text-xs font-bold text-primary-500 mb-2 tracking-wider">VOICE SELECTION</label>
            <app-voice-selector
              [voices]="voices"
              [voiceId]="selectedVoiceId"
              [userCanUseGlobal]="userCanUseNatural"
              [userCanUseSarvam]="userCanUseSarvam"
              (voiceChange)="handleVoiceChange($event); showSettings.set(false)"
              (filterChanged)="selectedVoiceType = $event"
              (showNotification)="handleNotification($event)"
            >
            </app-voice-selector>
          </div>

          <div class="pt-4 border-t border-primary-100 dark:border-primary-800">
            <label class="block text-xs font-bold text-primary-500 mb-2 tracking-wider">USAGE & LIMITS</label>
            <app-usage-stats
              [planType]="authService.currentPlanType()"
              [textLength]="text.length"
              [maxChars]="maxChars()"
            >
            </app-usage-stats>
          </div>
        </div>

        <!-- Footer -->
        <div class="px-6 py-4 border-t border-primary-200 dark:border-primary-800 flex justify-end bg-primary-50 dark:bg-primary-900/30">
          <button
            type="button"
            (click)="showSettings.set(false)"
            class="px-5 py-2 rounded-xl text-sm font-bold text-white bg-brand-blue hover:bg-brand-blue/90 shadow-lg active:scale-[0.98] transition-all"
          >
            Apply Settings
          </button>
        </div>
      </div>
    </div>
  }

  <app-toast></app-toast>
</div>
