<div class="min-h-screen bg-primary-50 dark:bg-primary-950">
  <app-navbar></app-navbar>

  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12">

    <!-- Page Header -->
    <div class="mb-8 animate-fade-in">
      <h1 class="text-3xl sm:text-3xl font-bold text-primary-900 dark:text-white mb-2">Text to Speech</h1>
      <p class="text-base sm:text-primary-500 dark:text-primary-400">Convert text to natural-sounding speech with AI</p>
    </div>

    <!-- Main Content Grid -->
    <div class="grid md:grid-cols-3 gap-2 md:gap-6 items-start">

      <!-- Left Column - Voice Selection & Stats -->
      <div class="md:col-span-1 flex flex-col gap-2 md:gap-6 animate-slide-up">



        <app-voice-selector
          [voices]="voices"
          [voiceId]="selectedVoiceId"
          [userCanUseNeural]="userCanUseNeural"
          [userCanUseNatural]="userCanUseNatural"
          (voiceChange)="handleVoiceChange($event)"
          (showNotification)="handleNotification($event)">
        </app-voice-selector>

        <app-usage-stats
          [planType]="authService.currentPlanType()"
          [textLength]="text.length"
          [maxChars]="maxChars()">
        </app-usage-stats>

        <app-upgrade-card
          *ngIf="authService.currentPlanType() !== 'ENTERPRISE'"
          [currentPlan]="authService.currentPlanType()"
          (upgrade)="invokeUpgrade($event)">
        </app-upgrade-card>
      </div>

      <!-- Right Column - Editor -->
      <div class="md:col-span-2 flex flex-col gap-2 md:gap-6 animate-slide-up stagger-1">
        <app-tts-input
          [(text)]="text"
          [maxChars]="maxChars()"
          [usage]="usage()"
          [loading]="loading()"
          [voiceId]="selectedVoiceId"
          (convert)="convert()">
        </app-tts-input>

        <!-- Error Alert -->
        <div *ngIf="error()" class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800/30 rounded-xl p-4">
          <p class="text-sm text-red-600 dark:text-red-400 flex items-center gap-2">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            {{ error() }}
          </p>
        </div>

        <app-tts-output
          *ngIf="audioUrl()"
          [audioUrl]="audioUrl()"
          (download)="download()">
        </app-tts-output>
      </div>
    </div>
  </div>

  <app-toast></app-toast>
</div>
