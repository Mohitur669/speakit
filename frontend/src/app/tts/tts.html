<div
    class="min-h-screen bg-white dark:bg-[#0a0e1a] text-slate-900 dark:text-slate-200 font-body px-4 py-8 lg:py-12 transition-colors duration-300">

    <!-- Header -->
    <div class="max-w-3xl mx-auto mb-10 lg:mb-14">
        <div class="flex items-center justify-between gap-4 mb-2">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-lg bg-amber-500 flex items-center justify-center text-xl shrink-0">
                    🎙
                </div>
                <h1 class="font-body text-4xl lg:text-5xl font-bold text-slate-900 dark:text-white">
                    Speak<span class="text-amber-400">IT</span>
                </h1>
            </div>
            <!-- Dark Mode Toggle -->
            <button (click)="toggleDarkMode()"
                class="p-2 rounded-lg bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors">
                <span *ngIf="isDarkMode" class="text-xl">☀️</span>
                <span *ngIf="!isDarkMode" class="text-xl">🌙</span>
            </button>
        </div>
        <p class="text-slate-600 dark:text-slate-400 font-body text-xs lg:text-sm mt-2 ml-16">
            Text-to-Speech with AWS Polly
        </p>
    </div>

    <!-- Main Content -->
    <div class="max-w-3xl mx-auto space-y-6">

        <!-- Text Input Card -->
        <div
            class="bg-slate-50 dark:bg-[#0f1528] border border-slate-200 dark:border-slate-700 rounded-xl p-5 lg:p-6 transition-all duration-200">
            <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-3 font-body">
                Your Text
            </label>
            <textarea [(ngModel)]="text" placeholder="Type or paste your text here..." rows="7" maxlength="3000"
                class="w-full bg-white dark:bg-[#0a0e1a] text-slate-900 dark:text-slate-100 placeholder-slate-500 text-base rounded-lg border border-slate-300 dark:border-slate-600 p-4 focus:outline-none focus:border-amber-500 resize-none transition-colors font-body"></textarea>
            <div class="flex justify-between items-center mt-4 pt-4 border-t border-slate-200 dark:border-slate-700">
                <span class="font-body text-xs text-slate-600 dark:text-slate-500">{{ text.length }} / 3000</span>
                <div class="w-40 h-2 bg-slate-300 dark:bg-slate-700 rounded-full overflow-hidden">
                    <div class="h-full bg-amber-500 transition-all duration-300"
                        [style.width.%]="(text.length / 3000) * 100">
                    </div>
                </div>
            </div>
        </div>

        <!-- Voice Selector -->
        <div class="bg-slate-50 dark:bg-[#0f1528] border border-slate-200 dark:border-slate-700 rounded-xl p-5 lg:p-6">
            <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-3 font-body">
                Voice
            </label>
            <select [(ngModel)]="selectedVoice"
                class="w-full bg-white dark:bg-[#0a0e1a] border border-slate-300 dark:border-slate-600 text-slate-900 dark:text-slate-100 rounded-lg px-4 py-3 focus:outline-none focus:border-amber-500 transition-colors cursor-pointer font-body">
                <option *ngFor="let voice of voices" [value]="voice.id">
                    {{ voice.name }} — {{ voice.gender }}
                </option>
            </select>
        </div>

        <!-- Convert Button -->
        <button (click)="convert()" [disabled]="loading || !text.trim()" class="w-full py-4 px-6 rounded-lg font-body font-semibold text-lg transition-all duration-200
                bg-amber-500 hover:bg-amber-600 text-white
                disabled:opacity-50 disabled:cursor-not-allowed
                active:scale-95 flex items-center justify-center gap-3">
            <span *ngIf="!loading" class="flex items-center gap-3">
                <span>🔊</span>
                <span class="hidden sm:inline">Convert to Speech</span>
                <span class="sm:hidden">Generate</span>
            </span>
            <span *ngIf="loading" class="flex items-center gap-3">
                <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                </svg>
                <span class="hidden sm:inline">Generating...</span>
            </span>
        </button>

        <!-- Error Message -->
        <div *ngIf="error"
            class="bg-red-100 dark:bg-red-950 border border-red-300 dark:border-red-700 text-red-800 dark:text-red-200 rounded-lg px-5 py-4">
            <p class="font-body text-sm">{{ error }}</p>
        </div>

        <!-- Audio Player -->
        <div *ngIf="audioUrl"
            class="bg-slate-50 dark:bg-[#0f1528] border border-amber-300 dark:border-amber-600 rounded-xl p-5 lg:p-6 space-y-4">

            <h3 class="text-sm font-semibold text-amber-600 dark:text-amber-400 font-body">Audio Output</h3>

            <!-- Audio element -->
            <audio #audioPlayer [src]="audioUrl" (timeupdate)="onTimeUpdate($event)" (play)="isPlaying = true"
                (pause)="isPlaying = false" (ended)="isPlaying = false"></audio>

            <!-- Progress Bar -->
            <div class="space-y-2">
                <div class="h-2 bg-slate-300 dark:bg-slate-700 rounded-full cursor-pointer overflow-hidden transition-all hover:h-3"
                    (click)="seekAudio($event)">
                    <div class="h-full bg-amber-500 rounded-full transition-all duration-100"
                        [style.width.%]="progressPercent">
                    </div>
                </div>
                <div class="flex justify-between text-xs text-slate-600 dark:text-slate-500 font-body">
                    <span>{{ currentTime | number:'1.0-0' }}s</span>
                    <span>{{ duration | number:'1.0-0' }}s</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="grid grid-cols-2 gap-3">
                <button (click)="togglePlayPause()"
                    class="py-3 rounded-lg bg-amber-500 hover:bg-amber-600 text-white font-body font-semibold transition-colors active:scale-95">
                    <span *ngIf="isPlaying">⏸ Pause</span>
                    <span *ngIf="!isPlaying">▶ Play</span>
                </button>
                <button (click)="download()"
                    class="py-3 rounded-lg bg-slate-700 hover:bg-slate-600 dark:bg-slate-700 dark:hover:bg-slate-600 text-white font-body font-semibold transition-colors active:scale-95">
                    ⬇ Download
                </button>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <div class="max-w-3xl mx-auto mt-16 text-center text-slate-500 dark:text-slate-600 text-xs font-body">
        <p>Built with Angular + Spring Boot + AWS Polly</p>
    </div>

    <!-- Toast Notification Component -->
    <app-toast [message]="toastMessage" [type]="toastType" [visible]="showToast">
    </app-toast>

</div>
