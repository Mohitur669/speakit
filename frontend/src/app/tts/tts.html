<div class="min-h-screen bg-slate-50 dark:bg-[#0a0e1a] transition-colors duration-500 overflow-x-hidden font-body">
    <app-navbar></app-navbar>

    <div class="w-full px-4 sm:px-8 lg:px-16 py-8 lg:py-12 animate-slide-up">

        <!-- Main Studio Container -->
        <div class="max-w-[1600px] mx-auto space-y-8">

            <!-- Studio Toolbar (New Top-aligned Configuration) -->
            <div class="bg-white dark:bg-[#0f1528] rounded-[2.5rem] p-6 lg:p-8 border border-slate-200 dark:border-slate-800 shadow-xl shadow-slate-200/50 dark:shadow-none transition-all">
                <div class="flex flex-col lg:flex-row items-center justify-between gap-8">

                    <!-- Left: Tiers & Identity -->
                    <div class="flex flex-col sm:flex-row items-center gap-6 w-full lg:w-auto">
                        <div class="flex flex-col items-center sm:items-start gap-2">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Narrator Tier</label>
                            <div class="inline-flex p-1 bg-slate-100 dark:bg-[#0a0e1a] rounded-xl border border-slate-200 dark:border-slate-800 font-bold shadow-inner">
                                <button (click)="setFilter('All')"
                                    [ngClass]="currentFilter === 'All' ? 'bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-md scale-[1.02]' : 'text-slate-500 hover:text-slate-700'"
                                    class="px-4 py-2 rounded-lg transition-all duration-300 text-[10px] uppercase">All</button>
                                <button (click)="setFilter('Standard')"
                                    [ngClass]="currentFilter === 'Standard' ? 'bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-md scale-[1.02]' : 'text-slate-500 hover:text-slate-700'"
                                    class="px-4 py-2 rounded-lg transition-all duration-300 text-[10px] uppercase border-x border-slate-200/50 dark:border-slate-800/50">Std</button>
                                <button (click)="setFilter('Neural')"
                                    [ngClass]="currentFilter === 'Neural' ? 'bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-md scale-[1.02]' : 'text-slate-500 hover:text-slate-700'"
                                    class="px-4 py-2 rounded-lg transition-all duration-300 relative group/btn text-[10px] uppercase">
                                    Neural
                                    <span *ngIf="!userCanUseNeural" class="ml-1 text-[10px] filter grayscale">🔒</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Right: Narrator Selector -->
                    <div class="flex flex-col items-center lg:items-end gap-2 w-full lg:w-[400px]">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Active Narrator</label>
                        <div class="relative w-full">
                            <!-- Custom Dropdown Trigger -->
                            <button (click)="toggleDropdown($event)"
                                class="w-full bg-slate-50 dark:bg-[#0a0e1a] border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100 rounded-2xl px-6 py-4 flex items-center justify-between group hover:border-amber-500/50 transition-all shadow-sm">
                                <div class="flex items-center gap-4">
                                    <span class="text-amber-500 text-lg">🎙</span>
                                    <div class="flex flex-col items-start">
                                        <span class="text-sm font-black">{{ selectedVoice?.name || 'Select Narrator' }}</span>
                                        <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">{{ selectedVoice?.gender }} — {{ voiceBadge(selectedVoice!) }}</span>
                                    </div>
                                </div>
                                <div class="text-xs opacity-30 transition-transform duration-300" [style.transform]="isDropdownOpen ? 'rotate(180deg)' : 'none'">▼</div>
                            </button>

                            <!-- Premium Dropdown List -->
                            <div *ngIf="isDropdownOpen"
                                class="absolute top-full left-0 w-full mt-4 bg-white dark:bg-[#161b2c] border border-slate-200 dark:border-slate-800 rounded-[2rem] shadow-2xl z-[100] max-h-[350px] overflow-y-auto animate-reveal-grid p-3 studio-scrollbar">
                                <button *ngFor="let voice of filteredVoices"
                                    (click)="selectVoice(voice.id)"
                                    class="w-full text-left p-4 rounded-xl hover:bg-slate-50 dark:hover:bg-[#1e2538] transition-all flex items-center justify-between group/item mb-1 last:mb-0">
                                    <div class="flex items-center gap-4">
                                        <div class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-[#0a0e1a] flex items-center justify-center text-lg group-hover/item:bg-amber-500 group-hover/item:text-white transition-all">
                                            {{ voice.gender === 'Female' ? '👩' : '👨' }}
                                        </div>
                                        <div class="flex flex-col">
                                            <span class="text-sm font-black text-slate-900 dark:text-white">{{ voice.name }}</span>
                                            <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">{{ voice.gender }}</span>
                                        </div>
                                    </div>
                                    <div [ngClass]="voice.isNeural ? 'bg-amber-500/10 text-amber-600' : 'bg-slate-100 dark:bg-slate-800 text-slate-400'"
                                        class="text-[8px] font-black px-3 py-1.5 rounded-lg uppercase tracking-widest border border-transparent">
                                        {{ voiceBadge(voice) }}
                                    </div>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Studio Editor Area -->
            <div class="space-y-8">
                <div class="bg-white dark:bg-[#0f1528] rounded-[3.5rem] p-8 lg:p-16 border border-slate-200 dark:border-slate-800 shadow-2xl shadow-slate-200/40 dark:shadow-none">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-12">
                        <div>
                            <h2 class="text-5xl font-black text-slate-900 dark:text-white tracking-tightest mb-2 font-heading">Studio Editor</h2>
                            <p class="text-slate-400 dark:text-slate-500 font-bold text-[10px] uppercase tracking-[0.3em]">Drafting master channel script</p>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="px-6 py-2 rounded-full bg-slate-50 dark:bg-slate-800 text-[11px] font-black text-slate-400 uppercase tracking-[0.2em] border border-slate-100 dark:border-slate-700 shadow-sm">
                                {{ text.length }} / 3000 chars
                            </span>
                        </div>
                    </div>

                    <textarea [(ngModel)]="text"
                        placeholder="Start typing your production script here..."
                        rows="12"
                        maxlength="3000"
                        class="w-full bg-slate-50/20 dark:bg-[#0a0e1a]/20 text-slate-900 dark:text-slate-100 placeholder-slate-400 text-2xl lg:text-3xl rounded-[2.5rem] border border-slate-100 dark:border-slate-800 p-12 focus:outline-none focus:ring-8 focus:ring-amber-500/5 focus:border-amber-500/20 resize-none transition-all leading-[1.5] font-medium"></textarea>

                    <div class="mt-12">
                        <button (click)="convert()" [disabled]="loading || !text.trim() || !selectedVoiceId"
                            class="w-full py-8 bg-amber-500 hover:bg-amber-600 text-white rounded-[2.5rem] font-bold text-2xl transition-all active:scale-[0.98] shadow-[0_20px_50px_rgba(245,158,11,0.3)] flex items-center justify-center gap-6 disabled:opacity-50 disabled:cursor-not-allowed group font-heading">
                            <span *ngIf="!loading" class="flex items-center gap-6 uppercase tracking-[0.2em] text-xl font-bold">
                                <span class="group-hover:rotate-12 transition-transform text-3xl">🎙</span> Synthesize Text
                            </span>
                            <span *ngIf="loading" class="flex items-center gap-6 uppercase tracking-[0.2em] text-xl font-bold">
                                <svg class="animate-spin h-8 w-8 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                                </svg>
                                Studio Rendering...
                            </span>
                        </button>
                    </div>

                    <!-- Error Alert -->
                    <div *ngIf="error" class="mt-8 p-8 bg-red-50 dark:bg-red-900/10 border border-red-100 dark:border-red-900/30 text-red-600 dark:text-red-400 rounded-[2.5rem] text-[13px] font-black uppercase tracking-[0.2em] animate-shake flex items-center gap-5">
                        <span class="text-2xl">⚠️</span> {{ error }}
                    </div>
                </div>

                <!-- Master Output Player & Export -->
                <div class="grid grid-cols-1 xl:grid-cols-4 gap-8">
                    <!-- Player Card (3/4 width on desktop) -->
                    <div *ngIf="audioUrl" class="xl:col-span-3 bg-white dark:bg-[#0f1528] rounded-[4rem] p-10 lg:p-14 border border-slate-200 dark:border-slate-800 shadow-2xl animate-reveal-grid">
                        <div class="flex flex-col md:flex-row items-center gap-12">
                            <button (click)="togglePlayPause()"
                                class="w-28 h-28 rounded-[2.5rem] bg-amber-500 hover:bg-amber-600 text-white flex items-center justify-center text-5xl transition-all active:scale-90 shadow-2xl shadow-amber-500/40 transform hover:-rotate-3 flex-shrink-0">
                                <span *ngIf="isPlaying">⏸</span>
                                <span *ngIf="!isPlaying" class="ml-2">▶</span>
                            </button>

                            <div class="flex-1 w-full space-y-6">
                                <div class="flex justify-between items-end">
                                    <div>
                                        <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.5em] mb-2">Master Audio Pipeline</h4>
                                        <p class="text-slate-900 dark:text-white font-black text-2xl tracking-tightest font-heading italic opacity-90 uppercase">Studio Output</p>
                                    </div>
                                    <span class="text-sm font-black text-slate-500 font-mono tracking-[0.2em] opacity-60">{{ currentTime | number:'1.0-0' }}S / {{ duration | number:'1.0-0' }}S</span>
                                </div>
                                <div class="h-6 bg-slate-100 dark:bg-slate-800 rounded-full cursor-pointer overflow-hidden group relative border-[6px] border-white dark:border-[#161b2c] shadow-inner" (click)="seekAudio($event)">
                                    <div class="h-full bg-gradient-to-r from-amber-400 via-orange-500 to-amber-600 rounded-full transition-all duration-100 relative shadow-lg" [style.width.%]="progressPercent">
                                        <div class="absolute inset-0 bg-white/30 animate-pulse"></div>
                                    </div>
                                    <div class="absolute top-0 left-0 w-full h-full opacity-0 group-hover:opacity-10 bg-white transition-opacity"></div>
                                </div>
                            </div>
                        </div>
                        <audio #audioPlayer [src]="audioUrl" (timeupdate)="onTimeUpdate($event)" (play)="isPlaying = true" (pause)="isPlaying = false" (ended)="isPlaying = false"></audio>
                    </div>

                    <!-- Export Card (1/4 width on desktop) -->
                    <div *ngIf="audioUrl" class="xl:col-span-1 bg-slate-900 dark:bg-white rounded-[3rem] p-8 shadow-2xl animate-reveal-grid flex flex-col justify-center gap-6 group cursor-pointer border-4 border-transparent hover:border-amber-500/30 transition-all" (click)="download()">
                        <div class="flex items-center justify-between">
                            <div class="w-16 h-16 rounded-[1.5rem] bg-white/10 dark:bg-slate-900/5 flex items-center justify-center text-4xl group-hover:scale-110 group-hover:rotate-12 transition-all">
                                📥
                            </div>
                            <div class="text-right">
                                <h3 class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-[0.2em] mb-1">Production Export</h3>
                                <p class="text-white dark:text-slate-900 font-black text-xl tracking-tight">Save Audio</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Global Toast -->
    <app-toast [message]="toastMessage" [type]="toastType" [visible]="showToast"></app-toast>
</div>
