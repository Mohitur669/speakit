<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>SpeakIT - AI Text to Speech</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Permissions-Policy" content="accelerometer=(self), gyroscope=(self), magnetometer=(self), microphone=(self)">
  <meta name="description" content="Transform text into natural-sounding speech with AI. Professional voice generation for content creators, developers, and businesses.">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <script src="./runtime-env.js"></script>

  <script>
    // Initialize dark mode
    if (localStorage['theme'] === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark')
    } else {
      document.documentElement.classList.remove('dark')
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #D4D4D8;
      border-radius: 3px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #3F3F46;
    }

    /* Focus ring */
    .focus-ring:focus {
      outline: none;
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px #3B82F6;
    }

    /* Smooth transitions */
    * {
      transition-property: background-color, border-color, color, fill, stroke;
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      transition-duration: 150ms;
    }

    /* Logo Marquee Animation */
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    @keyframes marquee-reverse {
      0% { transform: translateX(-50%); }
      100% { transform: translateX(0); }
    }
    @keyframes marquee-slow {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    @keyframes marquee-fast {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .animate-marquee {
      animation: marquee 40s linear infinite;
    }
    .animate-marquee-slow {
      animation: marquee-slow 60s linear infinite;
    }
    .animate-marquee-reverse {
      animation: marquee-reverse 60s linear infinite;
    }
    .animate-marquee-fast {
      animation: marquee 25s linear infinite;
    }
    .animate-marquee:hover,
    .animate-marquee-slow:hover,
    .animate-marquee-reverse:hover,
    .animate-marquee-fast:hover {
      animation-play-state: paused;
    }
  </style>
</head>

<body>
  <app-root></app-root>
</body>

</html>
