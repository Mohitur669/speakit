codecov:
  require_ci_to_pass: yes

coverage:
  status:
    project:
      default:
        target: auto      # Dynamically maps target to the parent commit's coverage percentage
        threshold: 1%     # Prevents regression; fails PR check if coverage drops by >1%
    patch:
      default:
        target: auto      # Targets coverage specifically on the newly modified code lines in the PR
        threshold: 2%
