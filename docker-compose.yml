services:
  backend:
    build:
      context: ./backend
    image: mohitur/speakit:backend
    container_name: speakit-backend
    ports:
      - "8080:8080"
    environment:
      # AWS Polly Credentials
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      
      # Database Configuration (Supabase PostgreSQL)
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      
      # Security & JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      
      # Backend CORS
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      
      # Rate Limiting
      - RATE_LIMIT_CAPACITY=${RATE_LIMIT_CAPACITY:-5}
      - RATE_LIMIT_REFILL_TOKENS=${RATE_LIMIT_REFILL_TOKENS:-5}
      - RATE_LIMIT_REFILL_DURATION_MINUTES=${RATE_LIMIT_REFILL_DURATION_MINUTES:-1}
      
      # Email Configuration
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/tts/voices || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    image: mohitur/speakit:frontend
    container_name: speakit-frontend
    ports:
      - "4200:80"
    environment:
      # Runtime Configuration (Injected via public/runtime-env.js)
      - API_URL=${API_URL:-http://localhost:8080}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
