<div class="container">
    <h1>🎙️ SpeakIT</h1>
    <p class="subtitle">Text to Speech powered by AWS Polly</p>

    <div class="form-group">
        <textarea [(ngModel)]="text" placeholder="Enter text to convert to speech..." rows="6" maxlength="3000">
    </textarea>
        <small>{{ text.length }}/3000 characters</small>
    </div>

    <div class="form-group">
        <label>Voice</label>
        <select [(ngModel)]="selectedVoice">
            <option *ngFor="let voice of voices" [value]="voice.id">
                {{ voice.name }} ({{ voice.gender }})
            </option>
        </select>
    </div>

    <div class="actions">
        <button class="btn-primary" (click)="convert()" [disabled]="loading || !text.trim()">
            {{ loading ? 'Converting...' : '🔊 Convert to Speech' }}
        </button>
    </div>

    <div class="error" *ngIf="error">{{ error }}</div>

    <div class="player" *ngIf="audioUrl">
        <audio #audioPlayer [src]="audioUrl" (timeupdate)="onTimeUpdate($event)"></audio>

        <div class="progress-bar" (click)="seekAudio($event)">
            <div class="progress-fill" [style.width.%]="progressPercent"></div>
        </div>

        <div class="time-info">
            {{ currentTime | number:'1.0-0' }}s / {{ duration | number:'1.0-0' }}s
        </div>

        <div class="player-actions">
            <button class="btn-secondary" (click)="audioPlayerRef.nativeElement.play()">▶ Play</button>
            <button class="btn-secondary" (click)="audioPlayerRef.nativeElement.pause()">⏸ Pause</button>
            <button class="btn-download" (click)="download()">⬇ Download MP3</button>
        </div>
    </div>
</div>
