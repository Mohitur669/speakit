# SonarQube Cloud Analysis Configuration
sonar.python.version=3.10, 3.11, 3.12, 3.13, 3.14

# Ignore CLI argument path/SSRF taint analysis on internal maintenance scripts
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.e1.resourceKey=scripts/**/*,.github/scripts/**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=pythonsecurity:S8703
sonar.issue.ignore.multicriteria.e2.resourceKey=scripts/**/*,.github/scripts/**/*
sonar.issue.ignore.multicriteria.e3.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.e3.resourceKey=scripts/**/*,.github/scripts/**/*
