spring.application.name=text-to-speech-backend

# Listen to Render's dynamic PORT or fallback to 8080 locally
server.port=${SERVER_PORT:8080}

# AWS Credentials (use env vars or IAM role in production)
aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretKey=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# logging.level.org.springframework=DEBUG

# Rate Limit
rate-limit.capacity=${RATE_LIMIT_CAPACITY:5}
rate-limit.refill-tokens=${RATE_LIMIT_REFILL_TOKENS:5}
rate-limit.refill-duration-minutes=${RATE_LIMIT_REFILL_DURATION_MINUTES:1}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Transaction settings for Session Pooler
spring.datasource.hikari.connection-init-sql=SET statement_timeout = 0;
spring.datasource.hikari.maximum-pool-size=10

# JWT
jwt.secret=${JWT_SECRET}
# 24 hours
jwt.expiration=${JWT_EXPIRATION_MS}

# Session Polling (Safety net heartbeat)
auth.session-poll-interval-ms=${SESSION_POLL_INTERVAL_MS:60000}

# Session Management
auth.session-duration-ms=${SESSION_DURATION_MS:7200000}
auth.idle-timeout-ms=${IDLE_TIMEOUT_MS:60000}

# Keep Alive (Render Spin-down prevention)
auth.keep-alive-url=${RENDER_EXTERNAL_URL}
auth.keep-alive-interval-ms=${KEEP_ALIVE_INTERVAL_MS:600000}