spring.application.name=text-to-speech-backend

# Listen to Render's dynamic PORT or fallback to 8080 locally
server.port=${SERVER_PORT:8080}

# AWS Credentials (use env vars or IAM role in production)
aws.accessKeyId=${AWS_ACCESS_KEY_ID:dummy-access-key}
aws.secretKey=${AWS_SECRET_ACCESS_KEY:dummy-secret-key}
aws.region=${AWS_REGION:us-east-1}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# logging.level.org.springframework=DEBUG

# Rate Limit
rate-limit.capacity=${RATE_LIMIT_CAPACITY:5}
rate-limit.refill-tokens=${RATE_LIMIT_REFILL_TOKENS:5}
rate-limit.refill-duration-minutes=${RATE_LIMIT_REFILL_DURATION_MINUTES:1}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/speakit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Transaction settings for Session Pooler
spring.datasource.hikari.connection-init-sql=SET statement_timeout = 0;
spring.datasource.hikari.maximum-pool-size=10

# JWT
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-for-development-only-change-in-prod}
# 24 hours
jwt.expiration=${JWT_EXPIRATION_MS:86400000}