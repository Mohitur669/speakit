spring.application.name=text-to-speech-backend

# Server & Proxy Trust (Secure IP Extraction)
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=FRAMEWORK
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto

# File Upload Limits (STT Support)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# Note: internal-proxies defaults to private IP ranges, which is safe for Render/Cloudflare.

# AWS Credentials (use env vars or IAM role in production)
aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretKey=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}

# AWS SES Specific Credentials (override if Polly and SES use different IAM users)
aws.ses.accessKeyId=${AWS_SES_ACCESS_KEY_ID:}
aws.ses.secretKey=${AWS_SES_SECRET_ACCESS_KEY:}
aws.ses.region=${AWS_SES_REGION:ap-south-1}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# logging.level.org.springframework=DEBUG

# Rate Limit
rate-limit.capacity=${RATE_LIMIT_CAPACITY:5}
rate-limit.refill-tokens=${RATE_LIMIT_REFILL_TOKENS:5}
rate-limit.refill-duration-minutes=${RATE_LIMIT_REFILL_DURATION_MINUTES:1}
rate-limit.live-param.capacity=${RATE_LIMIT_LIVE_PARAM:100}

# Database
# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Transaction settings for Session Pooler
spring.datasource.hikari.connection-init-sql=SET statement_timeout = 0;
spring.datasource.hikari.maximum-pool-size=10

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS}

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:placeholder_secret}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:placeholder_webhook_secret}

# Session Polling (Safety net heartbeat)
auth.session-poll-interval-ms=${SESSION_POLL_INTERVAL_MS:60000}

# Session Management
auth.session-duration-ms=${SESSION_DURATION_MS:7200000}
auth.idle-timeout-ms=${IDLE_TIMEOUT_MS:60000}

# Logging Configuration
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.springframework=${LOG_LEVEL_SPRING:WARN}
logging.level.com.speakit=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Log File Management
logging.file.name=${LOG_FILE_PATH:logs/speakit-backend.log}
logging.logback.rollingpolicy.max-file-size=${LOG_MAX_FILE_SIZE:10MB}
logging.logback.rollingpolicy.max-history=${LOG_MAX_HISTORY:30}
logging.logback.rollingpolicy.total-size-cap=${LOG_TOTAL_SIZE_CAP:1GB}

# Structured Logging Pattern (Includes Request-ID from MDC)
# Console (local dev only — strip ANSI if going to aggregator)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%thread] [%X{requestId}] %cyan(%logger{36}) : %msg%n%ex
# File (aggregator-safe, no ANSI)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [speakit] [%thread] [%X{requestId}] %logger{36} : %msg%n%ex

# Session Management
auth.session-duration-ms=${SESSION_DURATION_MS:7200000}
auth.idle-timeout-ms=${IDLE_TIMEOUT_MS:60000}

# Keep Alive (Render Spin-down prevention)
auth.keep-alive-url=${SELF_PING_URL:${RENDER_EXTERNAL_URL:}}
auth.keep-alive-interval-ms=${KEEP_ALIVE_INTERVAL_MS:840000}

# ElevenLabs
elevenlabs.apiKey=${ELEVENLABS_API_KEY:}

# Sarvam AI
sarvam.apiKey=${SARVAM_API_KEY:}

# Telegram Notification Integration (Maximum Security)
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.chat-id=${TELEGRAM_CHAT_ID:}

# Spring Mail Properties
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# SMTP Transport Protocol & Security (TLS Mandatory)
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Connection Timeouts
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# Custom Application Default Sender Fields
app.mail.from=${MAIL_FROM}
app.mail.reply-to=support@mohitur.com

# Email provider strategy toggle (SMTP or SES_API)
app.email.provider=${EMAIL_PROVIDER:SMTP}

# OTP Expiry (controlled by env with default of 10 minutes)
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}

# Java 21 / Spring Boot 3.2+ Virtual Threads Concurrency Optimization
spring.threads.virtual.enabled=true

# Sentry Configurations
sentry.dsn=${SENTRY_DSN_BACKEND:}
sentry.environment=${SENTRY_ENVIRONMENT:production}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.1}
sentry.release=${SENTRY_RELEASE:}
sentry.exception-resolver-order=${SENTRY_EXCEPTION_RESOLVER_ORDER:-2147483648}
sentry.send-default-pii=${SENTRY_SEND_DEFAULT_PII:false}

# New Relic Log Aggregator Configuration
newrelic.licensekey=${NEW_RELIC_LICENSE_KEY:}
newrelic.appname=${NEW_RELIC_APP_NAME:speakit-prod-backend}
newrelic.region=${NEW_RELIC_LOG_ENDPOINT_REGION:US}
