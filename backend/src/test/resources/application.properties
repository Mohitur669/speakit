spring.application.name=text-to-speech-backend

server.port=8080

# AWS dummy credentials for testing
aws.accessKeyId=dummy-access-key
aws.secretKey=dummy-secret-key
aws.region=us-east-1

cors.allowed-origins=http://localhost:4200

rate-limit.capacity=5
rate-limit.refill-tokens=5
rate-limit.refill-duration-minutes=1

# Use H2 in-memory for testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=test-secret-key-for-testing-purposes-only-must-be-at-least-256-bits
jwt.expiration=86400000